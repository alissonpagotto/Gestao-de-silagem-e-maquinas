<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Silagem Fácil CRM</title>
    <meta name="description" content="CRM Agrícola e Gestão Financeira com Lançamento Completo de Despesas, Vendas e Operações de Silagem" />
    <meta property="og:title" content="Silagem Fácil CRM" />
    <meta property="og:description" content="CRM Agrícola e Gestão Financeira com Lançamento Completo de Despesas, Vendas e Operações de Silagem" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
      try {
        const t = localStorage.getItem('silagem_facil_theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (_) {}
    </script>
  </head>
  <body class="bg-zinc-100 dark:bg-stone-950 text-stone-900 dark:text-stone-100 antialiased selection:bg-emerald-200 selection:text-emerald-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
