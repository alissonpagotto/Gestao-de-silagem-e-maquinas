<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Silagem Fácil CRM</title>
    <meta name="description" content="CRM Agrícola e Gestão Financeira com Lançamento Completo de Despesas, Vendas e Operações de Silagem" />
    <meta property="og:title" content="Silagem Fácil CRM" />
    <meta property="og:description" content="CRM Agrícola e Gestão Financeira com Lançamento Completo de Despesas, Vendas e Operações de Silagem" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; worker-src 'self' blob:; connect-src 'self' https: wss:; font-src 'self' https://fonts.gstatic.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:;" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" as="style">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="modulepreload" href="/src/main.tsx">
    <script>
      // Proteção global contra travamento por checagem Cross-Origin em sandbox iframe
      window.addEventListener('error', function(event) {
        if (event && (event.message?.includes('cross-origin') || event.message?.includes('Cross-Origin') || event.message?.includes('Blocked a frame'))) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      }, true);

      window.onerror = function(msg) {
        if (typeof msg === 'string' && (msg.includes('cross-origin') || msg.includes('Cross-Origin') || msg.includes('Blocked a frame'))) {
          return true;
        }
      };

      try {
        const t = localStorage.getItem('silagem_facil_theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (_) {}
    </script>
  </head>
  <body class="bg-zinc-100 dark:bg-stone-950 text-stone-900 dark:text-stone-100 antialiased selection:bg-emerald-200 selection:text-emerald-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
